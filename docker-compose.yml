services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexalinx-web
    container_name: nexalinx-web
    restart: unless-stopped
    # Host 8058 -> container 8058 (app listens on 8058 inside the container too)
    ports:
      - "8058:8058"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=8058
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8058/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
